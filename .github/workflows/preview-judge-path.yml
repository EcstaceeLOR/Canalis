name: preview-judge-path

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      preview_url:
        description: Public Vercel preview URL to verify
        required: true
        type: string

permissions:
  contents: read
  deployments: read

jobs:
  preview-judge-path:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Preview')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PLAYWRIGHT_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_url || github.event.deployment_status.environment_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run the judge path against the deployed preview
        run: pnpm e2e:judge
      - name: Upload preview failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preview-judge-path-failure-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 3

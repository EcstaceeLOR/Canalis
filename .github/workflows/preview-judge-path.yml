name: preview-judge-path

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      preview_url:
        description: Public Vercel preview URL to verify
        required: true
        type: string

permissions:
  contents: read
  deployments: read
  id-token: write

jobs:
  preview-judge-path:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.VERCEL_PREVIEW_TRUSTED == 'true' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Preview')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PLAYWRIGHT_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_url || github.event.deployment_status.environment_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Acquire short-lived GitHub OIDC identity
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          token="$(OIDC_RESPONSE="$response" node -e '
            const body = JSON.parse(process.env.OIDC_RESPONSE);
            if (typeof body.value !== "string" || !body.value) process.exit(1);
            process.stdout.write(body.value);
          ')"
          echo "::add-mask::$token"
          printf 'VERCEL_OIDC_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
      - name: Run the judge path against the deployed preview
        run: pnpm e2e:judge
      - name: Upload preview failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preview-judge-path-failure-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 3

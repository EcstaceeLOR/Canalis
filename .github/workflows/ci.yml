name: ci

on:
  push:
    branches: [main, issue-1-channel-spike, issue-1-devnet-proof]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: canalis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d canalis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/canalis_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @canalis/persistence db:migrate
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm security:check

  devnet-proof:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Prove Solana payment-channel lifecycle on devnet
        run: pnpm --filter @canalis/channel-spike devnet:proof
        env:
          SVM_RPC_URL: https://api.devnet.solana.com
      - name: Upload devnet proof artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: canalis-devnet-payment-channel-proof
          path: examples/channel-spike/devnet-proof.json
          if-no-files-found: error
